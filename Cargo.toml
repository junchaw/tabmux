[package]
name = "tabmux"
version = "0.1.0"
edition = "2021"
description = "Isolated tmux with a bottom session tab bar"
license = "MIT"
authors = ["JC <me@junchaw.com>"]
repository = "https://github.com/junchaw/tabmux"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
